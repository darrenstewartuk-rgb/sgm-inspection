<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SGM Inspect">
  <meta name="description" content="SGM Window Manufacturing Ltd — Factory Inspection v1.6">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="assets/icon-192.svg">

  <title>SGM Factory Inspection</title>
  <link rel="stylesheet" href="css/styles.css?v=16">
</head>
<body>

  <header id="app-header">
    <span class="logo-badge">SGM</span>
    <h1>Factory Inspection</h1>
  </header>

  <main id="app-content"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/jspdf.min.js"></script>
  <script src="js/config.js?v=16"></script>
  <script src="js/db.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/pdf-gen.js?v=16"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=16', { updateViaCache: 'none' })
        .then(reg => {
          reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) reg.update().catch(() => {});
          });
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            // Reload once when the updated worker takes control, keeping IndexedDB intact.
            if (sessionStorage.getItem('sgm-updated-v16') !== 'yes') {
              sessionStorage.setItem('sgm-updated-v16', 'yes');
              location.reload();
            }
          });
        }).catch(() => {});
    }
  </script>
</body>
</html>
